<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      #bell { transform-box: view-box; transform-origin: 250px 80px; animation: bellShake 3s ease-in-out infinite; }
      #wave-1, #wave-2 { transform-box: fill-box; transform-origin: center; animation: wavePulse 3s ease-in-out infinite; }
      #beaver-bob { transform-box: view-box; transform-origin: 120px 205px; animation: happyHop 3s ease-in-out infinite; }
      @keyframes bellShake { 0%, 80%, 100% { transform: rotate(0); } 85% { transform: rotate(-8deg); } 90% { transform: rotate(8deg); } 95% { transform: rotate(-4deg); } }
      @keyframes wavePulse { 0%, 80%, 100% { opacity: 0; transform: scale(0.9); } 88% { opacity: 0.8; transform: scale(1.1); } }
      @keyframes happyHop { 0%, 80%, 100% { transform: translateY(0); } 88% { transform: translateY(-6px); } 94% { transform: translateY(0); } }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
    </style>
  </defs>
  <g id="scene">
    
    <g id="backdrop">
      <path d="M 50 110 C 50 40 130 35 200 35 C 270 35 320 75 320 135 C 320 195 240 215 170 215 C 90 215 50 180 50 110 Z" fill="#E5EEFF" />
    </g>

    
    <line id="ground-line" x1="20" y1="205" x2="340" y2="205" stroke="#E2E8F0" stroke-width="2" stroke-linecap="round" />

    
    <g id="props">
      
      <g id="bell">
        <path d="M 240 85 C 240 70 260 70 260 85 L 265 92 L 235 92 Z" fill="#2457D6" />
        <circle cx="250" cy="95" r="3" fill="#203F91" />
        
        <path id="wave-1" d="M 230 75 Q 225 85 230 95" stroke="#2457D6" stroke-width="2" stroke-linecap="round" fill="none" opacity="0" />
        <path id="wave-2" d="M 270 75 Q 275 85 270 95" stroke="#2457D6" stroke-width="2" stroke-linecap="round" fill="none" opacity="0" />
      </g>

      
      <g id="phone">
        <rect x="185" y="110" width="32" height="52" rx="6" fill="#142653" />
        <rect x="188" y="115" width="26" height="42" rx="4" fill="#FFFFFF" />
        
        <circle cx="201" cy="136" r="10" fill="#2457D6" />
        <path d="M 196 136 L 199 139 L 206 132" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      </g>
    </g>

    
    <g id="beaver">
      <g id="beaver-bob">
        
        <g id="tail">
          <path d="M 80 185 C 50 180 20 168 15 188 C 10 202 40 208 80 198 Z" stroke="rgba(255,255,255,0.18)" stroke-width="2" fill="none" />
          <path d="M 80 183 C 50 178 20 166 15 186 C 10 200 40 206 80 196 Z" fill="#5C3A1E" />
        </g>

        
        <g id="foot-back">
          <ellipse cx="100" cy="203" rx="12" ry="5" fill="#5C3A1E" />
        </g>

        
        <g id="body">
          <path d="M 95 137 C 75 157 75 192 95 201 L 145 201 C 165 192 165 157 145 137 Z" fill="#A06235" />
          <path d="M 95 137 C 75 157 75 192 95 201 L 112 201 C 90 180 85 150 100 137 Z" fill="#6B3F20" />
        </g>

        
        <g id="backpack">
          <rect x="72" y="145" width="18" height="32" rx="4" fill="#2457D6" />
          <rect x="70" y="152" width="5" height="18" rx="2" fill="#203F91" />
        </g>

        
        <g id="arm-back">
          <ellipse cx="142" cy="167" rx="6" ry="4" fill="#6B3F20" />
        </g>

        
        <g id="foot-front">
          <ellipse cx="130" cy="203" rx="12" ry="5" fill="#5C3A1E" />
        </g>

        
        <g id="arm-front">
          <path d="M 115 160 C 130 155 150 145 170 145 C 175 145 178 152 170 158 C 150 165 130 168 118 168 Z" fill="#A06235" />
          <ellipse cx="172" cy="150" rx="6" ry="5" fill="#A06235" />
        </g>

        
        <g id="head">
          <g id="ear-left">
            <circle cx="82" cy="75" r="12" fill="#A06235" />
            <circle cx="82" cy="75" r="7" fill="#5C3A1E" />
          </g>
          <g id="ear-right">
            <circle cx="158" cy="75" r="12" fill="#A06235" />
            <circle cx="158" cy="75" r="7" fill="#5C3A1E" />
          </g>

          <ellipse cx="120" cy="100" rx="46" ry="38" fill="#A06235" />

          
          <g id="cap">
            <path d="M 82 72 C 82 50 158 50 158 72 Z" fill="#2457D6" />
            <path d="M 115 72 L 168 70 L 165 77 L 115 76 Z" fill="#203F91" /> 
          </g>

          <g id="cheek-left"><ellipse cx="92" cy="110" rx="7" ry="4" fill="#E58A6B" opacity="0.25" /></g>
          <g id="cheek-right"><ellipse cx="148" cy="110" rx="7" ry="4" fill="#E58A6B" opacity="0.25" /></g>

          <g id="muzzle">
            <path d="M 102 108 C 102 96 114 94 128 94 C 142 94 152 96 152 108 C 152 120 142 124 128 124 C 114 124 102 120 102 108 Z" fill="#F8E8CC" />
          </g>
          <g id="teeth">
            <path d="M 122 118 L 134 118 L 133 129 C 133 130 132 131 130 131 L 126 131 C 124 131 123 130 123 129 Z" fill="#FFFFFF" />
            <line x1="128" y1="118" x2="128" y2="130" stroke="#D9B88F" stroke-width="1" />
          </g>
          <g id="nose">
            <path d="M 122 115 Q 128 119 134 115" stroke="#1B2A55" stroke-width="1.8" stroke-linecap="round" fill="none" />
            <line x1="128" y1="108" x2="128" y2="116" stroke="#1B2A55" stroke-width="1.5" />
            <path d="M 121 105 C 121 101 124 98 128 98 C 132 98 135 101 135 105 C 135 109 131 111 128 111 C 125 111 121 109 121 105 Z" fill="#1B2A55" />
          </g>

          <g id="eye-left-closed"><path d="M 94 96 Q 100 88 106 96" stroke="#1B2A55" stroke-width="2.8" stroke-linecap="round" fill="none" /></g>
          <g id="eye-right-closed"><path d="M 136 96 Q 142 88 148 96" stroke="#1B2A55" stroke-width="2.8" stroke-linecap="round" fill="none" /></g>
          <g id="eye-left-open" opacity="0">
            <circle cx="100" cy="94" r="4.5" fill="#1B2A55" />
            <circle cx="98" cy="92" r="1.5" fill="#FFFFFF" />
          </g>
          <g id="eye-right-open" opacity="0">
            <circle cx="142" cy="94" r="4.5" fill="#1B2A55" />
            <circle cx="140" cy="92" r="1.5" fill="#FFFFFF" />
          </g>
          <g id="eye-left-happy" opacity="0">
            <path d="M 94 94 Q 100 86 106 94" stroke="#1B2A55" stroke-width="3" stroke-linecap="round" fill="none" />
          </g>
          <g id="eye-right-happy" opacity="0">
            <path d="M 136 94 Q 142 86 148 94" stroke="#1B2A55" stroke-width="3" stroke-linecap="round" fill="none" />
          </g>
        </g>
      </g>
    </g>

    
    <g id="sparkles">
      <g id="sparkle-1">
        <path d="M 230 55 Q 230 60 225 60 Q 230 60 230 65 Q 230 60 235 60 Q 230 60 230 55 Z" fill="#2457D6" opacity="0.6" />
      </g>
    </g>
  </g>
</svg>
