<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      #beaver-bob { transform-box: view-box; transform-origin: 110px 205px; animation: beaverBreathing 3.5s ease-in-out infinite; }
      #scale-needle { transform-box: view-box; transform-origin: 260px 172px; animation: needleSettle 3.5s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
      #check-2, #check-3 { transform-box: fill-box; transform-origin: center; animation: checkFadeIn 3.5s ease-in-out infinite; }
      #check-3 { animation-delay: 0.5s; }
      #head { transform-box: view-box; transform-origin: 110px 105px; animation: headNod 3.5s ease-in-out infinite; }
      @keyframes beaverBreathing { 0%, 100% { transform: translateY(0) scaleY(1); } 50% { transform: translateY(-2px) scaleY(1.015); } }
      @keyframes needleSettle { 0% { transform: rotate(0); } 30% { transform: rotate(38deg); } 50% { transform: rotate(22deg); } 65% { transform: rotate(28deg); } 80%, 100% { transform: rotate(25deg); } }
      @keyframes checkFadeIn { 0%, 30% { opacity: 0; transform: scale(0.6); } 45%, 90% { opacity: 1; transform: scale(1); } 100% { opacity: 0; } }
      @keyframes headNod { 0%, 100% { transform: rotate(0); } 40%, 60% { transform: rotate(4deg); } }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } #check-2, #check-3 { opacity: 1; transform: none; } }
    </style>
  </defs>
  <g id="scene">
    
    <g id="backdrop">
      <path d="M 50 110 C 50 40 130 35 210 35 C 280 35 320 75 320 135 C 320 195 240 215 160 215 C 80 215 50 180 50 110 Z" fill="#E5EEFF" />
    </g>

    
    <line id="ground-line" x1="20" y1="205" x2="340" y2="205" stroke="#E2E8F0" stroke-width="2" stroke-linecap="round" />

    
    <g id="props">
      
      <g id="scale">
        <rect x="220" y="195" width="80" height="10" rx="2" fill="#64748B" />
        <path d="M 230 195 L 240 150 L 280 150 L 290 195 Z" fill="#CBD5F5" />
        
        <circle cx="260" cy="172" r="12" fill="#FFFFFF" />
        <g id="scale-needle">
          <line x1="260" y1="172" x2="267" y2="165" stroke="#2457D6" stroke-width="2" stroke-linecap="round" />
        </g>
      </g>

      
      <g id="trash-bag">
        <path d="M 240 150 C 235 150 230 135 240 120 C 250 105 270 105 280 120 C 290 135 285 150 280 150 Z" fill="#A9B8D6" opacity="0.8" />
      </g>

      
      <g id="clipboard">
        <rect x="160" y="120" width="30" height="42" rx="3" fill="#D09F5F" />
        <rect x="164" y="125" width="22" height="32" fill="#FFFFFF" />
        <rect x="170" y="117" width="10" height="5" rx="1" fill="#64748B" />
        
        <path id="check-1" d="M 168 132 L 171 135 L 177 129" stroke="#2457D6" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="1" />
        <path id="check-2" d="M 168 142 L 171 145 L 177 139" stroke="#2457D6" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0" />
        <path id="check-3" d="M 168 150 L 171 153 L 177 147" stroke="#2457D6" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0" />
      </g>
    </g>

    
    <g id="beaver">
      <g id="beaver-bob">
        <g id="tail"><path d="M 70 185 C 40 180 10 168 5 188 C 0 202 30 208 70 198 Z" fill="#5C3A1E" /></g>
        <g id="foot-back"><ellipse cx="90" cy="203" rx="12" ry="5" fill="#5C3A1E" /></g>
        <g id="body"><path d="M 85 137 C 65 157 65 192 85 201 L 135 201 C 155 192 155 157 135 137 Z" fill="#A06235" /></g>
        <g id="backpack"><rect x="65" y="145" width="16" height="30" rx="3" fill="#2457D6" /></g>
        <g id="foot-front"><ellipse cx="120" cy="203" rx="12" ry="5" fill="#5C3A1E" /></g>

        
        <g id="arm-front">
          <path d="M 110 155 L 162 145" stroke="#A06235" stroke-width="8" stroke-linecap="round" />
        </g>

        <g id="head">
          <circle cx="72" cy="75" r="12" fill="#A06235" />
          <circle cx="148" cy="75" r="12" fill="#A06235" />
          <ellipse cx="110" cy="100" rx="46" ry="38" fill="#A06235" />

          <g id="cap">
            <path d="M 72 72 C 72 52 148 52 148 72 Z" fill="#2457D6" />
            <path d="M 105 72 L 158 70 L 155 77 L 105 76 Z" fill="#203F91" />
          </g>

          <path d="M 92 108 C 92 96 104 94 118 94 C 132 94 142 96 142 108 Z" fill="#F8E8CC" />
          <path d="M 112 118 L 124 118 L 123 129 Z" fill="#FFFFFF" />
          <path d="M 111 105 C 111 101 114 98 118 98 C 122 98 125 101 125 105 Z" fill="#1B2A55" />

          <g id="eye-left-closed"><path d="M 84 96 Q 90 88 96 96" stroke="#1B2A55" stroke-width="2.8" stroke-linecap="round" fill="none" /></g>
          <g id="eye-right-closed"><path d="M 126 96 Q 132 88 138 96" stroke="#1B2A55" stroke-width="2.8" stroke-linecap="round" fill="none" /></g>
        </g>
      </g>
    </g>

    <g id="sparkles">
      <g id="sparkle-1">
        <path d="M 270 85 Q 270 90 265 90 Q 270 90 270 95 Q 270 90 275 90 Q 270 90 270 85 Z" fill="#2457D6" opacity="0.5" />
      </g>
    </g>
  </g>
</svg>
