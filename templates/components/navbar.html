<header class="sticky top-0 z-30 border-b border-outline-variant/40 bg-surface-container-lowest/95 backdrop-blur-xl md:fixed md:left-64 md:right-0 md:top-0">

            <span class="grid h-9 w-9 place-items-center rounded-xl bg-primary-container text-white shadow-button" aria-hidden="true">
                <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M19.2 4.8C12.3 4.8 7.1 6.7 5.1 11.3c-1.2 2.8.3 5.6 2.9 6.2 2.8.6 5.6-1.1 6.8-4.1.8-2.1.9-4.4.9-6.2 1.2 1.5 2.2 3.5 2.2 6.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M4.7 20c2.3-3.7 5.3-5.9 9.2-7.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>

        <div class="flex min-w-0 flex-1 items-center gap-3 sm:gap-5 md:flex-initial">
        <form class="relative min-w-0 flex-1 md:w-80 md:flex-none" role="search" action="" method="get">
            <label class="sr-only" for="site-search">Search transactions and materials</label>
            <svg class="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-on-surface-variant" viewBox="0 0 24 24" fill="none" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><circle cx="10.8" cy="10.8" r="6.8" stroke="currentColor" stroke-width="1.8"/><path d="m16 16 4.2 4.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>

        </form>
        <div class="hidden shrink-0 items-center gap-2 rounded-lg bg-surface-container-low px-3 py-2 text-sm font-semibold text-on-surface sm:flex" aria-label="Current location: Jakarta Selatan, Indonesia">
            <svg class="h-4 w-4 text-primary" viewBox="0 0 24 24" fill="none" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z" stroke="currentColor" stroke-width="1.7"/><circle cx="12" cy="10" r="2.5" stroke="currentColor" stroke-width="1.7"/></svg>
            <span>Jakarta Selatan, ID</span>
        </div>
        </div>
        <div class="ml-auto flex shrink-0 items-center gap-3 sm:gap-4">
        <a class="inline-flex h-10 shrink-0 items-center justify-center gap-2 rounded-xl bg-primary-container px-3 text-sm font-bold text-white shadow-button transition hover:bg-primary focus-visible:outline focus-visible:outline-2 focus-visible:outline-primary focus-visible:outline-offset-2 sm:px-4" href="/waste/new/">
            <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            <span class="hidden sm:inline">New Submission</span><span class="sr-only sm:hidden">New submission</span>

        <a class="grid h-10 w-10 shrink-0 place-items-center rounded-xl bg-primary text-white transition hover:bg-primary-container focus-visible:outline focus-visible:outline-2 focus-visible:outline-primary focus-visible:outline-offset-2" href="/profile/" aria-label="Profile">
            <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="8" r="3.5" stroke="currentColor" stroke-width="1.7"/><path d="M5 20c.7-3.2 3.2-5 7-5s6.3 1.8 7 5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        </a>
